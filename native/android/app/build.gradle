plugins {
    id 'com.android.application'
}

// versão única do PC e do Android: native/VERSION (ex.: 0.9.0 -> versionCode 900, 1.0.0 -> 10000)
def indigoVersion = new File(rootDir, "../VERSION").text.trim()
def indigoParts = indigoVersion.tokenize('.').collect { it as int }
def indigoCode = indigoParts[0] * 10000 + indigoParts[1] * 100 + indigoParts[2]

android {
    namespace = "net.abitante.indigo"
    compileSdkVersion 35
    ndkVersion = "27.3.13750724"
    defaultConfig {
        applicationId "net.abitante.indigo"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode indigoCode
        versionName indigoVersion
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-24", "-DANDROID_STL=c++_static", "-DCMAKE_BUILD_TYPE=Release"
                abiFilters 'arm64-v8a'
            }
        }
    }
    // chave fixa (repositório privado): assim cada APK novo instala por cima do anterior sem apagar os saves
    buildTypes {
        release {
            minifyEnabled false
        }
        // debug usa a chave de depuração do Android (o APK oficial é sempre o release, assinado no GitHub Actions)
        debug {
        }
    }
    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }
    lint {
        abortOnError = false
    }
}
